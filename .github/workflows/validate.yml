name: validate-graph
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate graph schema, references, trip plans and links
        run: python3 scripts/validate_graph.py
      - name: Check generated files and exports are up to date
        run: python3 scripts/sync.py --check
