name: validate-graph
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate graph schema and references
        run: python3 scripts/validate_graph.py
      - name: Check exports are up to date
        run: python3 scripts/sync.py --check
